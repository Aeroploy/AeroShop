<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ product['name'] }} | AeroShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow">

    <div class="container">

        <a href="/" class="navbar-brand fw-bold">

            🛒 AeroShop

        </a>

        <div>

            {% if user %}

                <span class="text-white me-3">

                    👋 {{ user }}

                </span>

                <a href="/logout" class="btn btn-danger btn-sm">

                    Logout

                </a>

            {% else %}

                <a href="/login" class="btn btn-primary btn-sm">

                    Login

                </a>

            {% endif %}

            <span class="badge bg-warning text-dark ms-3">

                Cart : {{ cart_count }}

            </span>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="row">

        <!-- Product Image -->
        <div class="col-md-6">

            <img src="{{ url_for('static', filename='images/' + product['image']) }}"
                 class="img-fluid rounded shadow"
                 style="height:450px; width:100%; object-fit:cover;">

        </div>

        <!-- Product Details -->
        <div class="col-md-6">

            <span class="badge bg-secondary mb-2">

                {{ product['category'] }}

            </span>

            <h2 class="fw-bold">

                {{ product['name'] }}

            </h2>

            <h3 class="text-success my-3">

                ₹{{ product['price'] }}

            </h3>

            <p class="text-muted">

                {{ product['description'] }}

            </p>

            <hr>

            <!-- Buttons -->
            <div class="d-grid gap-2">

                <a href="{{ url_for('add_wishlist', product_id=product['id']) }}"
                   class="btn btn-outline-danger btn-lg">

                    ❤️ Add To Wishlist

                </a>

                <a href="{{ url_for('add_to_cart', product_id=product['id']) }}"
                   class="btn btn-primary btn-lg">

                    🛒 Add To Cart

                </a>

                <a href="/"
                   class="btn btn-outline-dark btn-lg">

                    ⬅ Back

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
