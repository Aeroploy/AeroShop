<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist | AeroShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a href="/" class="navbar-brand fw-bold">
            🛒 AeroShop
        </a>

        <div>

            <a href="/" class="btn btn-outline-light btn-sm">
                🏠 Home
            </a>

            <span class="badge bg-warning text-dark ms-3">
                Cart : {{ cart_count }}
            </span>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="mb-4 text-center">
        ❤️ My Wishlist
    </h2>

    {% if products %}

    <div class="row">

        {% for product in products %}

        <div class="col-md-4 mb-4">

            <div class="card shadow h-100">

                <img src="{{ url_for('static', filename='images/' + product['image']) }}"
                     class="card-img-top"
                     style="height:250px;object-fit:cover;">

                <div class="card-body text-center">

                    <h4>{{ product['name'] }}</h4>

                    <h5 class="text-success">
                        ₹{{ product['price'] }}
                    </h5>

                    <div class="d-grid gap-2 mt-3">

                        <a href="{{ url_for('product_details', product_id=product['id']) }}"
                           class="btn btn-info">
                            👁 View Details
                        </a>

                        <a href="{{ url_for('add_to_cart', product_id=product['id']) }}"
                           class="btn btn-primary">
                            🛒 Add To Cart
                        </a>

                        <a href="{{ url_for('remove_wishlist', product_id=product['id']) }}"
                           class="btn btn-danger">
                            ❌ Remove
                        </a>

                    </div>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

    {% else %}

    <div class="alert alert-warning text-center">

        <h4>
            ❤️ Your Wishlist is Empty
        </h4>

        <br>

        <a href="/" class="btn btn-primary">
            Continue Shopping
        </a>

    </div>

    {% endif %}

</div>

</body>
</html>
